[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-agents"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.35,<1", "httpx>=0.27,<1", "pydantic>=2.12,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "websocket-client>=1.8,<2"]

[tool.setuptools.packages.find]
include = ["enterprise*"]

[tool.setuptools.package-data]
enterprise = ["acceptance-schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: executes the real Harness runtime", "live: uses paid DeepSeek API"]

